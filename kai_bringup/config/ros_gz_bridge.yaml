- topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# The wind, changed from ROS: speed (m/s), direction (degrees the wind
# comes from, clockwise from north) and the gust parameters, any of them, as
# named double parameters. Every world here is named default.
- topic_name: "/world/default/wind/set"
  ros_type_name: "ros_gz_interfaces/msg/ParamVec"
  gz_type_name: "gz.msgs.Param"
  direction: ROS_TO_GZ
