- topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# The wind, changed from ROS: speed (m/s), direction (degrees the wind
# comes from, clockwise from north) and the gust parameters, any of them, as
# named double parameters. Every world here is named default.
- topic_name: "/world/default/wind/set"
  ros_type_name: "ros_gz_interfaces/msg/ParamVec"
  gz_type_name: "gz.msgs.Param"
  direction: ROS_TO_GZ

# The wind, as ground truth: the air's velocity at the reference height, in
# the world frame.
- topic_name: "/world/default/wind/velocity"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: GZ_TO_ROS

# The ocean current, changed from ROS: speed (m/s), direction (degrees the
# current sets towards, clockwise from north) and water_level (m) as named
# double or integer parameters, any of them; any other name is a parameter
# the current model owns, a string or a number.
- topic_name: "/world/default/ocean_current/set"
  ros_type_name: "ros_gz_interfaces/msg/ParamVec"
  gz_type_name: "gz.msgs.Param"
  direction: ROS_TO_GZ

# The ocean current, as ground truth: the water's velocity in the world
# frame.
- topic_name: "/world/default/ocean_current_info"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: GZ_TO_ROS
