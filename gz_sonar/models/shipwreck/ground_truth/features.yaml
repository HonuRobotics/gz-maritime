# Named features of the shipwreck. Generated by build_shipwreck.py; edit the script.
#
# Frame: the shipwreck model frame, which is also every part's .glb origin.
#   origin  on the seabed plane, on the keel centerline, at the boiler's forward face
#   +X      toward the bow      +Y  to port      +Z  up
#   z = 0   the seabed plane; geometry below it is buried
# A feature's world position is the model's <pose> applied to its position here.
# Positions are in meters. The meshes in meshes/ are the exact ground-truth geometry.
frame: shipwreck model frame
features:
  - name: bow_stem
    part: hull
    position: [32.5, 0.0, 0.6]
    note: "stem post, about 1.2 m proud"
  - name: stern_post
    part: hull
    position: [-15.3, 0.0, 1.3]
    note: "stern post, about 2.6 m proud"
  - name: hull_break_forward
    part: hull
    position: [19.0, 0.0, 0.0]
    note: "gap between bow and midship sections, 2 m"
  - name: hull_break_aft
    part: hull
    position: [1.5, 0.0, 0.0]
    note: "gap between midship and aft sections, 1 m"
  - name: aft_hatch
