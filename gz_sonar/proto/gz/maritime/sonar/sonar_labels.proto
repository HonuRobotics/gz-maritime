syntax = "proto3";
package gz.maritime.sonar;

import "gz/msgs/header.proto";

/// Ground truth for one ping: for every beam and sample, which surface sent
/// it the most energy. 
message SonarLabels
{
  gz.msgs.Header header = 1;
  uint64 ping           = 2;
  uint32 beam_count     = 3;
  uint32 sample_count   = 4;
  /// Beam-major label ids, one byte per cell; 0 for nothing.
  bytes labels          = 5;
  /// The scoped name of each label id, indexed by id; entry 0 is empty.
  repeated string names = 6;
}
