syntax = "proto3";
package gz.maritime.sonar;

import "gz/msgs/header.proto";

/// One ping of an imaging or sidescan sonar, beam by sample, shaped like
/// marine_acoustic_msgs/ProjectedSonarImage so the ROS 2 bridge is a copy.
/// The stamp is the sim time of the scene the ping saw; the frame is the
/// sensor's, x along the acoustic axis.
message SonarImage
{
  enum DataType
  {
    /// 8-bit readout of an imaging sonar.
    UINT8 = 0;
    /// Levels in dB re full scale, a sidescan's.
    FLOAT32 = 1;
  }

  gz.msgs.Header header        = 1;
  /// Ping number, which with the seed fixes the ping's random draws.
  uint64 ping                  = 2;
  /// Center frequency, Hz.
  double frequency             = 3;
  /// The sound speed the ranges were computed with, m/s.
  double sound_speed           = 4;
  /// -3 dB widths: one beam across the fan, and the fan's thickness, rad.
  float beam_width_horizontal  = 5;
  float beam_width_vertical    = 6;
  uint32 beam_count            = 7;
  uint32 sample_count          = 8;
  /// Azimuth of each beam (about the sensor's z axis), rad.
  repeated float azimuths      = 9;
  /// Center range of each sample, m.
  repeated float ranges        = 10;
  DataType data_type           = 11;
  /// Beam-major: data[beam * sample_count + sample], little-endian.
  bytes data                   = 12;
  /// Gain applied, dB, and the time-varied gain at each sample, dB, so a
  /// consumer can take them out again.
  double gain                  = 13;
  repeated float tvg           = 14;
}
