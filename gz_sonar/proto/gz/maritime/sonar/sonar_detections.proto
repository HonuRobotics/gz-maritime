syntax = "proto3";
package gz.maritime.sonar;

import "gz/msgs/header.proto";

/// One ping of a profiling sonar: its soundings, a two-way travel time and
/// an angle per detection, as marine_acoustic_msgs/SonarDetections carries
/// them. Arrays are per sounding and all the same length.
message SonarDetections
{
  gz.msgs.Header header        = 1;
  /// Ping number, which with the seed fixes the ping's random draws.
  uint64 ping                  = 2;
  /// Center frequency, Hz.
  double frequency             = 3;
  /// The sound speed the device assumes to turn time into range, m/s.
  double sound_speed           = 4;
  /// -3 dB widths: the receive beam across the fan, and the fan's
  /// thickness along track, rad.
  float beam_width_across      = 5;
  float beam_width_along       = 6;
  /// Angle of each sounding across the fan, about the sensor's z axis, rad.
  repeated float angles        = 7;
  /// Two-way travel time of each sounding, s.
  repeated float travel_times  = 8;
  /// Level above the noise floor, dB; NaN where the device reports none.
  repeated float intensities   = 9;
  /// marine_acoustic_msgs/DetectionFlag values: 0 good, 1 bad sonar,
  /// 2 bad filter.
  repeated uint32 flags        = 10;
}
