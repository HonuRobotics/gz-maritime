# Documentation site: https://honurobotics.github.io/gz-maritime/
# Built and deployed by the shared workflow from HonuRobotics/honu-docs.
# Add each new distribution branch to push.branches as it is created.

name: Documentation

on:
  push:
    branches: [lyrical]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  # No path filter: the docs check is required by branch protection, so it
  # must run (and pass) on every pull request.
  pull_request:

jobs:
  docs:
    uses: HonuRobotics/honu-docs/.github/workflows/docs.yml@v0.1.0
    permissions:
      contents: write
    with:
      default_version: lyrical
