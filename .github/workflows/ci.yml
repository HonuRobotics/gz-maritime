name: CI

on:
  pull_request:
  push:
    branches: [lyrical]
  schedule:
    # Mondays 03:00 UTC. DEPS_EPOCH changes at Monday 00:00 UTC, and the
    # week's first run that writes the caches (this one, unless a push to
    # lyrical came first) rebuilds the dependency layer, so the week's later
    # pull requests start warm. A pull request before it builds cold.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      cold:
        description: Read no cache, to measure a cold build (the layer cache is still written)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Builds the CI image. Runs in this repository push it to GHCR for the
  # test jobs; a fork's image stays on the runner, from a pull request here or
  # a run in the fork, and its CPU tests run here.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # to check out the repository
      packages: write # to push the image to GHCR
    env:
      IMAGE: ghcr.io/honurobotics/gz-maritime-ci:sha-${{ github.sha }}
      # Bake's tags, which check_image_tags.sh holds to IMAGE.
      TAG: sha-${{ github.sha }}
      EXTRA_TAG: ${{ github.event_name == 'push' && 'lyrical' || '' }}
      # Only this repository may push to IMAGE: a run in a fork (a push, a
      # manual run, a pull request between its branches) would get a 403.
      SAME_REPO: ${{ github.repository == 'HonuRobotics/gz-maritime' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      image: ${{ env.IMAGE }}
      same_repo: ${{ env.SAME_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs git credentials; keep the token off disk.
          persist-credentials: false

      - name: Free disk before the build
        run: df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      - name: Dependency epoch
        id: epoch
        run: echo "deps_epoch=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Pull requests only read the ccache; pushes, the weekly run and manual
      # runs also save it, after the cache dance has taken it out of BuildKit.
      # A cold manual run neither reads nor saves it.
      - name: Restore the ccache
        if: github.event_name == 'pull_request' && !inputs.cold
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ccache-${{ steps.epoch.outputs.deps_epoch }}-${{ hashFiles('.github/ci/Dockerfile', '*/package.xml') }}-${{ github.run_id }}
          restore-keys: ccache-${{ steps.epoch.outputs.deps_epoch }}-${{ hashFiles('.github/ci/Dockerfile', '*/package.xml') }}-

      - name: Restore and save the ccache
        if: github.event_name != 'pull_request' && !inputs.cold
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ccache-${{ steps.epoch.outputs.deps_epoch }}-${{ hashFiles('.github/ci/Dockerfile', '*/package.xml') }}-${{ github.run_id }}
          restore-keys: ccache-${{ steps.epoch.outputs.deps_epoch }}-${{ hashFiles('.github/ci/Dockerfile', '*/package.xml') }}-

      - name: Move the ccache in and out of BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "ccache": {"target": "/ccache", "id": "ccache"}
            }
          skip-extraction: ${{ github.event_name == 'pull_request' }}
          # The action's default image, ghcr.io/containerd/busybox:latest on
          # 2026-11-25, pinned like the actions: it writes the ccache.
          utility-image: ghcr.io/containerd/busybox@sha256:52f73a0a43a16cf37cd0720c90887ce972fe60ee06a687ee71fb93a7ca601df7

      - name: Log in to GHCR
        if: env.SAME_REPO == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every run but a cold one reads the layer cache; only non-PR runs, cold
      # ones included, write it, so pull requests never evict the shared
      # layers. A failed cache write only warns: the image is still pushed.
      # Same-repo images are pushed.
      - name: Bake settings
        id: bake
        run: |
          {
            echo 'set<<EOF'
            echo 'ci.cache-from=type=gha,scope=gz-maritime-ci'
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              echo 'ci.cache-to=type=gha,scope=gz-maritime-ci,mode=max,ignore-error=true'
            fi
            if [ "$SAME_REPO" = true ]; then
              echo 'ci.output=type=image,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true'
            else
              echo 'ci.output=type=docker'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Bake reads this job's environment, so a variable that shares a name
      # with one of bake's would change the tags.
      - name: Check the image tags
        run: bash .github/ci/check_image_tags.sh

      - name: Build the image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          DEPS_EPOCH: ${{ steps.epoch.outputs.deps_epoch }}
        with:
          source: .
          files: .github/ci/docker-bake.hcl
          targets: ci
          no-cache: ${{ inputs.cold == true }}
          set: ${{ steps.bake.outputs.set }}

      - name: Image size
        if: env.SAME_REPO == 'true'
        run: |
          manifest=$(docker buildx imagetools inspect --raw "$IMAGE")
          jq -r '.layers[] | "\(.size)\t\(.digest)"' <<< "$manifest"
          echo "IMAGE_SIZE compressed_bytes=$(jq '[.layers[].size] | add' <<< "$manifest") layers=$(jq '.layers | length' <<< "$manifest")"

      - name: Free disk after the build
        run: df -h /

      - name: Run the CPU tests
        if: env.SAME_REPO != 'true'
        run: |
          mkdir -p results
          docker run --rm --name gz-tests -v "$PWD/results:/results" "$IMAGE" /ws/src/gz-maritime/.github/ci/run_tests.sh cpu

      # A cancel or a timeout stops the step's shell, not the container. TERM
      # makes run_tests.sh copy what the tests left before the upload.
      - name: Stop the tests
        if: always() && env.SAME_REPO != 'true'
        run: |
          if docker kill --signal TERM gz-tests > /dev/null 2>&1; then
            timeout 120 docker wait gz-tests > /dev/null || true
          fi

      - name: Upload the CPU test results
        if: always() && env.SAME_REPO != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-cpu
          path: results

  test-cpu:
    needs: image
    if: needs.image.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No checkout: the tests and run_tests.sh are in the image.
    permissions:
      packages: read # to pull the image from GHCR
    env:
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        run: docker pull "$IMAGE"

      - name: Run the CPU tests
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          docker run --rm --name gz-tests -v "$RUNNER_TEMP/results:/results" "$IMAGE" /ws/src/gz-maritime/.github/ci/run_tests.sh cpu

      # A cancel or a timeout stops the step's shell, not the container. TERM
      # makes run_tests.sh copy what the tests left before the upload.
      - name: Stop the tests
        if: always()
        run: |
          if docker kill --signal TERM gz-tests > /dev/null 2>&1; then
            timeout 120 docker wait gz-tests > /dev/null || true
          fi

      - name: Upload the CPU test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-cpu
          path: ${{ runner.temp }}/results

  # Deletes the CI images nothing needs any more; see the script.
  cleanup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the script
      packages: write # to delete image versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script calls the API with GH_TOKEN; git needs no credentials.
          persist-credentials: false

      - name: Delete old CI images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/ci/ghcr_cleanup.sh
